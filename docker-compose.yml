services:
  # ==================== 基础设施 ====================

  # MySQL 主库（写）
  mysql-cludae:
    image: mysql:8.0
    container_name: golinko-mysql-cludae
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: golinko
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mysql_Cludae_data:/var/lib/mysql
      - ./scripts/mysql/cludae.cnf:/etc/mysql/conf.d/cludae.cnf:ro
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL 从库（读）
  mysql-slave:
    image: mysql:8.0
    container_name: golinko-mysql-slave
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "13307:3306"
    volumes:
      - mysql_slave_data:/var/lib/mysql
      - ./scripts/mysql/slave.cnf:/etc/mysql/conf.d/slave.cnf:ro
    command: --server-id=2 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON --read-only=ON
    depends_on:
      mysql-cludae:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: golinko-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka 消息队列 (使用 Apache 官方镜像)
  kafka:
    image: apache/kafka:3.7.0
    container_name: golinko-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_NUM_PARTITIONS: "6"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: golinko-minio
    ports:
      - "9000:9000"   # API 端口
      - "9001:9001"   # 控制台端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MySQL 主从同步初始化 ====================

  # MySQL 主从同步配置初始化器
  mysql-replication-init:
    image: mysql:8.0
    container_name: golinko-mysql-replication-init
    depends_on:
      mysql-cludae:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    volumes:
      - ./scripts/mysql/init_replication.sh:/init_replication.sh:ro
    entrypoint: ["/bin/bash", "/init_replication.sh"]
    restart: "no"

  # ==================== GoLinko 实例 ====================

  # GoLinko 实例 1
  golinko-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golinko-1
    ports:
      - "8081:8080"
    environment:
      - INSTANCE_ID=instance-1
      - GIN_MODE=release
    depends_on:
      mysql-cludae:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro

  # GoLinko 实例 2
  golinko-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golinko-2
    ports:
      - "8082:8080"
    environment:
      - INSTANCE_ID=instance-2
      - GIN_MODE=release
    depends_on:
      mysql-cludae:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro

  # ==================== 负载均衡 ====================

  # Nginx 负载均衡
  nginx:
    image: nginx:alpine
    container_name: golinko-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - golinko-1
      - golinko-2

volumes:
  mysql_Cludae_data:
  mysql_slave_data:
  redis_data:
  kafka_data:
  minio_data:
